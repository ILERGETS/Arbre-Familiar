<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arbre familiar</title>
<style>
html { height: -webkit-fill-available; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; box-sizing: border-box;
  min-height: 100vh; min-height: 100dvh; min-height: -webkit-fill-available;
  font-family: Arial, sans-serif; color: #111; background: #f7f3ef;
}
#cal-safari { margin: 0.6rem 0.7rem; padding: 0.5rem 0.7rem; background: #fff4cc; border: 1px solid #e0c36a; }
header { position: relative; padding: 0.4rem 0.7rem 0.35rem; border-bottom: 1px solid #e0d8d0; }
.fila { display: flex; flex-wrap: wrap; gap: 0.35rem 0.55rem; align-items: center; }
h1 { font-size: 1.05rem; margin: 0 0.4rem 0 0; }
button, input { font: inherit; touch-action: manipulation; }
nav button, #fitxa button, #index button, #resultats button, #obre-index, #obre-repas, #enrere, #obre-rar, #idioma-actual, #fes-rar {
  background: #fff; border: 1px solid #c8c0b8; border-radius: 6px; cursor: pointer;
}
nav button { padding: 0.28rem 0.6rem; }
nav button[aria-pressed="true"] { font-weight: 700; border-color: #333; }
#cerca { padding: 0.32rem 0.5rem; min-width: 14rem; border: 1px solid #c8c0b8; border-radius: 6px; }
.cerca-bloc { position: relative; }
#llegenda { margin: 0.28rem 0 0; font-size: 0.72rem; color: #444; line-height: 1.35; }
#resultats {
  position: absolute; z-index: 45; left: 0; top: calc(100% + 0.2rem); margin: 0; padding: 0;
  list-style: none; background: #fff; border: 1px solid #ccc; min-width: 22rem; max-height: 20rem; overflow: auto;
}
#resultats button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #eee; border-radius: 0; padding: 0.35rem 0.6rem; }
#resultats button.actiu { background: #fff4cc; }
#resultats small, #index small { display: block; color: #555; font-size: 0.75rem; }
#resultats .compte, #index .compte { padding: 0.35rem 0.6rem; color: #444; font-size: 0.8rem; }
#vista { flex: 1 1 auto; min-height: 0; overflow: hidden; position: relative; background: #fff; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
#vista.agafa { cursor: grabbing; }
#mon { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
.caixa {
  position: absolute; box-sizing: border-box; border: 0.8px solid #545454; background: #fff;
  display: flex; overflow: hidden; pointer-events: auto; cursor: pointer;
}
.caixa.viu { background: #F8D4C4; }
.caixa.repas { background: #fff; border-color: #E07B00; border-width: 1.4px; }
.caixa.fantasma { background: #ebebeb; border-color: #aaa; color: #888; }
.caixa.mira {
  border-color: #1a1a1a; border-width: calc(3px / var(--escala, 1)); background: #ffe9a0; z-index: 4;
}
#mon.llinatge .caixa { opacity: 0.42; }
#mon.llinatge .caixa.mira, #mon.llinatge .caixa.prop { opacity: 1; }
#mon.llinatge .caixa.prop { box-shadow: inset 0 0 0 calc(2px / var(--escala, 1)) #1a5fb4; }
#mon.llinatge g.bus.prop line, #mon.llinatge g.bus.prop path { stroke: #1a5fb4; }
.franges { position: absolute; left: 1px; top: 1px; bottom: 1px; width: 3.5px; display: flex; flex-direction: column; }
.franges i { flex: 1; display: block; }
.sexe { width: 20px; height: 20px; flex: none; align-self: center; }
.cos { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 1px 3px 1px 1px; }
.caixa.sexe-m .cos { padding-left: 4px; }
.caixa.pont .cos { justify-content: flex-start; }
.nom, .cog, .dates { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nom { font-size: 8px; font-weight: 700; color: #111; }
.cog { font-size: 7px; color: #444; }
.dates { font-size: 6.5px; color: #666; }
.caixa.fantasma .nom, .caixa.fantasma .cog, .caixa.fantasma .dates { color: #888; }
.tambe {
  margin-top: auto; font-size: 5.5px; line-height: 1.05; color: #444;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal;
}
#fitxa {
  position: fixed; z-index: 40; top: 0.6rem; right: 0.6rem; bottom: 0.6rem; width: 22rem;
  max-width: calc(100vw - 1.2rem); box-sizing: border-box; overflow: auto;
  background: #fff; border: 1px solid #e0d8d0; border-radius: 10px;
  padding: 0.85rem 1rem 1.2rem; box-shadow: -8px 0 24px rgba(0,0,0,.12);
}
#fitxa p { margin: 0.35rem 0; line-height: 1.35; }
#fitxa .versio { margin: 0 2.2rem 0.35rem 0; font-size: 0.85rem; color: #444; }
#fitxa .dim { margin: 0.15rem 0 0; font-size: 1.35rem; font-weight: 700; line-height: 1.2; }
#fitxa h2 { margin: 0.1rem 0 0.45rem; font-size: 1.15rem; font-weight: 700; line-height: 1.25; }
#fitxa .dim + h2 { font-size: 1rem; font-weight: 400; }
#fitxa .estat { font-weight: 700; }
#fitxa .dubte { color: #7a4b00; }
#fitxa .veure { margin-top: 0.8rem; font-weight: 700; }
#fitxa button {
  display: flex; align-items: center; width: 100%; text-align: left; margin-top: 0.45rem;
  padding: 0.55rem 0.75rem; min-height: 2.6rem; font-size: 1rem; font-weight: 700;
  border-left-width: 8px;
}
#fitxa button small { margin-left: 0.35rem; font-size: 0.9rem; font-weight: 600; color: #333; }
#fitxa button.tanca {
  float: right; width: auto; min-height: 0; margin: 0; padding: 0.2rem 0.55rem;
  font-size: 0.85rem; font-weight: 400; border-left-width: 1px;
}
#index {
  position: fixed; z-index: 35; top: 0.6rem; left: 0.6rem; bottom: 0.6rem; width: 24rem;
  max-width: calc(100vw - 1.2rem); box-sizing: border-box; overflow: auto;
  background: #fff; border: 1px solid #e0d8d0; border-radius: 10px;
  padding: 0.85rem 1rem 1.2rem; box-shadow: 8px 0 24px rgba(0,0,0,.12);
}
#index h2 { margin: 0 2.2rem 0.45rem 0; font-size: 1.15rem; }
#index .filtres { display: flex; flex-wrap: wrap; gap: 0.3rem; }
#index .filtres button {
  width: auto; min-height: 0; margin: 0; padding: 0.2rem 0.5rem;
  font-size: 0.8rem; font-weight: 400; border-left-width: 1px;
}
#index .filtres button[aria-pressed="true"] { font-weight: 700; border-color: #333; }
#index ul { list-style: none; margin: 0.4rem 0 0; padding: 0; }
#index li button {
  display: block; width: 100%; text-align: left; margin: 0; min-height: 0;
  padding: 0.35rem 0.15rem; font-size: 0.95rem; font-weight: 400;
  border: 0; border-bottom: 1px solid #eee; border-radius: 0; border-left-width: 0;
}
#index button.tanca {
  float: right; width: auto; min-height: 0; margin: 0; padding: 0.2rem 0.55rem;
  font-size: 0.85rem; font-weight: 400; border-left-width: 1px;
}
#obre-index, #obre-repas, #enrere, #obre-rar, #idioma-actual { padding: 0.28rem 0.6rem; }
.desplegable { position: relative; }
#idioma-actual, #obre-rar { display: inline-flex; align-items: center; gap: 0.35rem; }
#idioma-actual::after {
  content: ""; border: 4px solid transparent; border-top-color: #333; margin-top: 3px;
}
#idiomes svg, #llista-idiomes svg { width: 18px; height: 12px; display: block; box-shadow: 0 0 0 1px #bbb; }
#llista-idiomes, #rar {
  position: absolute; z-index: 50; top: calc(100% + 0.25rem); left: 0; margin: 0;
  background: #fff; border: 1px solid #ccc; border-radius: 8px;
  box-shadow: 0 8px 20px rgba(0,0,0,.12);
}
#llista-idiomes { list-style: none; padding: 0.25rem; min-width: 11rem; }
#llista-idiomes button {
  display: flex; align-items: center; gap: 0.45rem; width: 100%; text-align: left;
  border: 0; background: transparent; border-radius: 4px; padding: 0.35rem 0.45rem; cursor: pointer;
}
#llista-idiomes button[aria-selected="true"] { font-weight: 700; background: #fff4cc; }
#rar { padding: 0.55rem 0.7rem 0.65rem; min-width: 17rem; }
#rar-ajuda { margin: 0 0 0.4rem; font-size: 0.78rem; color: #444; line-height: 1.35; }
#rar-families label {
  display: flex; align-items: center; gap: 0.4rem; margin: 0.12rem 0; padding-left: 0.35rem;
}
#fes-rar { margin-top: 0.45rem; padding: 0.28rem 0.6rem; }
#rar-estat { margin: 0.35rem 0 0; min-height: 1rem; font-size: 0.78rem; color: #444; }
#enrere:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid #1a5fb4; }
#taller { position: fixed; left: -40000px; top: 0; pointer-events: none; }
#impressio { display: none; }
.full { background: #fff; color: #111; position: relative; overflow: hidden; box-sizing: border-box; }
.full .cap { position: absolute; left: 28pt; top: 8pt; margin: 0; font-size: 13pt; font-weight: 700; }
.full .peu { position: absolute; left: 28pt; right: 28pt; bottom: 8pt; margin: 0; font-size: 8pt; color: #555; }
.full .finestra { position: absolute; overflow: hidden; }
.full .escala-pt { transform-origin: 0 0; }
.linia-encaix { position: absolute; display: block; width: 0; border-left: 0.7pt solid #d91a1a; z-index: 3; }
.nota-encaix { position: absolute; margin: 0; color: #d91a1a; font-size: 7pt; z-index: 3; white-space: nowrap; }
.trama {
  position: absolute; z-index: 2;
  background: repeating-linear-gradient(45deg, transparent 0 7pt, #999 7pt 7.4pt);
}
.marca-tall { position: absolute; display: block; background: #888; }
.full.fitxa-impresa { padding: 16mm 16mm 20mm; }
.full.fitxa-impresa h2 { margin: 0.15rem 0 0.4rem; font-size: 16pt; }
.full.fitxa-impresa .dim { margin: 0.4rem 0 0; font-size: 18pt; font-weight: 700; }
.full.fitxa-impresa p { margin: 0.28rem 0; line-height: 1.35; }
@media print {
  body.imprimint > header,
  body.imprimint #vista,
  body.imprimint #fitxa,
  body.imprimint #index,
  body.imprimint #taller { display: none !important; }
  body.imprimint #impressio { display: block !important; }
  .full { break-after: page; }
  .full:last-child { break-after: auto; }
}
</style>

let idioma = "ca";
try {
  const desatIdioma = localStorage.getItem("arbre-idioma");
  if (desatIdioma && TEXTOS[desatIdioma]) idioma = desatIdioma;
} catch (e) { /* sense emmagatzematge local */ }
function t(clau) {
  const paquet = TEXTOS[idioma] || TEXTOS.ca;
  const valor = paquet[clau];
  return valor == null || valor === "" ? (TEXTOS.ca[clau] || clau) : valor;
}
function tf(clau, valors) {
  return t(clau).replace(/\{(\w+)\}/g, (_, k) => (valors[k] == null ? "" : String(valors[k])));
}
function titolText() { return tf("titol", { versio: DADES.versio }); }
function textCompte(n) {
  if (!n) return t("cap");
  return tf(n === 1 ? "una" : "moltes", { n: n });
}
function textPista(pista) {
  if (!pista) return "";
  if (typeof pista === "string") return pista;
  return tf("pista_" + pista.r, { nom: pista.nom });
}
function textDates(caixa) {
  const naix = caixa.naix || "?";
  if (caixa.def) return naix + " · " + caixa.def;
  return tf("nascut", { data: naix });
}
function textTambe(noms) {
  if (!noms || !noms.length) return "";
  return tf("tambe", { noms: noms.join(t("i_conj")) });
}
function textRel(codi, curt) {
  return t((curt ? "r_" : "rel_") + codi);
}
function aplicaChrome() {
  document.documentElement.lang = idioma;
  titol.textContent = titolText();
  document.title = titolText();
  llegenda.textContent = t("llegenda");
  cerca.placeholder = t("cerca");
  cerca.setAttribute("aria-label", t("cerca"));
  nav.setAttribute("aria-label", t("branques"));
  fitxa.setAttribute("aria-label", t("fitxa_persona"));
  document.getElementById("index").setAttribute("aria-label", t("index_persones"));
  for (const [id, clau] of [
    ["obre-index", "index"], ["obre-repas", "repas"], ["enrere", "enrere"],
    ["obre-rar", "rar"], ["fes-rar", "descarrega"],
  ]) document.getElementById(id).textContent = t(clau);
  document.getElementById("rar-ajuda").textContent = t("rar_ajuda");
  pintaSelectorIdioma();
}
function pintaSelectorIdioma() {
  const grup = document.getElementById("idiomes");
  grup.className = "desplegable";
  grup.setAttribute("aria-label", t("idioma"));
  grup.textContent = "";
  const actual = IDIOMES.find((item) => item[0] === idioma) || IDIOMES[0];
  const boto = document.createElement("button");
  boto.type = "button";
  boto.id = "idioma-actual";
  boto.setAttribute("aria-haspopup", "listbox");
  boto.setAttribute("aria-expanded", "false");
  boto.innerHTML = actual[2];
  const nom = document.createElement("span");
  nom.textContent = actual[1];
  boto.appendChild(nom);
  const llista = document.createElement("ul");
  llista.id = "llista-idiomes";
  llista.setAttribute("role", "listbox");
  llista.hidden = true;
  for (const item of IDIOMES) {
    const opcio = document.createElement("li");
    const tria = document.createElement("button");
    tria.type = "button";
    tria.setAttribute("role", "option");
    tria.setAttribute("aria-selected", item[0] === idioma ? "true" : "false");
    tria.innerHTML = item[2];
    const etiqueta = document.createElement("span");
    etiqueta.textContent = item[1];
    tria.appendChild(etiqueta);
    tria.addEventListener("click", (e) => {
      e.stopPropagation();
      if (item[0] === idioma) {
        llista.hidden = true;
        boto.setAttribute("aria-expanded", "false");
        return;
      }
      triaIdioma(item[0]);
    });
    opcio.appendChild(tria);
    llista.appendChild(opcio);
  }
  boto.addEventListener("click", (e) => {
    e.stopPropagation();
    const obert = llista.hidden;
    llista.hidden = !obert;
    boto.setAttribute("aria-expanded", obert ? "true" : "false");
    const panell = document.getElementById("rar");
    if (panell) panell.hidden = true;
  });
  grup.appendChild(boto);
  grup.appendChild(llista);
}
document.addEventListener("click", () => {
  const llista = document.getElementById("llista-idiomes");
  const boto = document.getElementById("idioma-actual");
  if (!llista || !boto) return;
  llista.hidden = true;
  boto.setAttribute("aria-expanded", "false");
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const llista = document.getElementById("llista-idiomes");
  const boto = document.getElementById("idioma-actual");
  if (!llista || llista.hidden || !boto) return;
  llista.hidden = true;
  boto.setAttribute("aria-expanded", "false");
});
function triaIdioma(codi) {
  if (!TEXTOS[codi] || codi === idioma) return;
  idioma = codi;
  try { localStorage.setItem("arbre-idioma", codi); } catch (e) { /* igual */ }
  aplicaChrome();
  pinta();
  if (seleccio) marca(seleccio);
  if (!fitxa.hidden && seleccio) obreFitxa(seleccio);
  if (!document.getElementById("index").hidden) pintaIndex();
  if (cerca.value.trim()) pintaCerca();

    const ara = cua.shift();

    [A3W - 18, 18, -10, 0], [A3W - 18, 18, 0, 10],
    [18, A3H - 18, 10, 0], [18, A3H - 18, 0, -10],
    [A3W - 18, A3H - 18, -10, 0], [A3W - 18, A3H - 18, 0, -10],
  ];
  for (const punta of cantonades) marcaTall(seccio, punta[0], punta[1], punta[2], punta[3]);
  const extra = tf("full_a3", { i: index + 1, n: calc.n });
  seccio.appendChild(textPeu(nom, extra));
  if (index < calc.n - 1) {
    const ajuda = document.createElement("p");
    ajuda.className = "peu";
    ajuda.style.bottom = "20pt";
    ajuda.textContent = t("zona");
    seccio.appendChild(ajuda);
  }
  return seccio;
}
function estilPagines(sencers) {
  const antic = document.getElementById("mides-impressio");
  if (antic) antic.remove();
  const estil = document.createElement("style");
  estil.id = "mides-impressio";
  const regles = sencers.map((full) =>
    "@page " + full.pagina + " { size: " + full.ample + "pt " + full.alt + "pt; margin: 0; }\n.full." + full.pagina + " { page: " + full.pagina + "; }"
  );
  regles.push("@page a3 { size: " + A3W + "pt " + A3H + "pt; margin: 0; }");
  regles.push(".full.a3 { page: a3; }");
  regles.push("@page fitxa { size: A4; margin: 0; }");
  regles.push(".full.fitxa-impresa { page: fitxa; }");
  estil.textContent = regles.join("\n");
  document.head.appendChild(estil);
}
function buidaImpressio() {
  impressio.textContent = "";
  const estil = document.getElementById("mides-impressio");
  if (estil) estil.remove();
}
function llança(titol) {
  const abans = document.title;
  document.title = titol;
  document.body.classList.add("imprimint");
  const neteja = () => {
    document.body.classList.remove("imprimint");
    document.title = abans;
    buidaImpressio();
    window.removeEventListener("afterprint", neteja);
  };
  window.addEventListener("afterprint", neteja);
  window.print();
}
function afegeixBranca(nom, index, ambSencer, ambA3) {
  const bloc = DADES.branques[nom];
  pintaEn(taller, nom);
  const sencers = [];
  if (ambSencer) {
    const full = fullSencer(nom, index, clonaAra());
    sencers.push(full);
    impressio.appendChild(full.seccio);
  }
  if (ambA3) {
    const calc = compteA3(bloc.w, bloc.h);
    for (let i = 0; i < calc.n; i++) impressio.appendChild(fullA3(nom, i, calc, clonaAra()));
  }
  return sencers;
}
function imprimirFitxa(id) {
  const persona = perId.get(id);
  if (!persona) return;
  buidaImpressio();
  const article = document.createElement("article");
  article.className = "full fitxa-impresa";
  const versio = document.createElement("p");
  versio.textContent = titolText();
  article.appendChild(versio);
  if (persona.dim) {
    const dim = document.createElement("p");
    dim.className = "dim";
    dim.textContent = persona.dim;
    article.appendChild(dim);
  }
  const nom = document.createElement("h2");
  nom.textContent = ((persona.nom || "") + " " + (persona.cog || "")).trim();
  article.appendChild(nom);
  const estat = document.createElement("p");
  estat.textContent = textEstat(persona);
  article.appendChild(estat);
  if (persona.dubte) {
    const dubte = document.createElement("p");
    dubte.textContent = persona.dubte;
    article.appendChild(dubte);
  }
  if (persona.variants && persona.variants.length) {
    const variants = document.createElement("p");
    variants.textContent = t("variants") + persona.variants.join(", ");
    article.appendChild(variants);
  }
  if (persona.estil !== "fantasma") {
    article.appendChild(liniaFet(t("naixement"), persona.naix, persona.lloc_naix));
    if (persona.estil !== "viu" || persona.def || persona.lloc_def) {
      article.appendChild(liniaFet(t("defuncio"), persona.def, persona.lloc_def));
    }
  }
  const casa = document.createElement("p");
  casa.textContent = tf("branca_de", { nom: persona.casa || branca });
  article.appendChild(casa);
  const grups = ["pare", "mare", "cònjuge", "fill", "filla", "germà", "germana"];
  for (const clau of grups) {
    const membres = (persona.rel || []).filter((pas) => pas.r === clau);
    if (!membres.length) continue;
    const linia = document.createElement("p");
    linia.textContent = textRel(clau, false) + ": " + membres.map((pas) => pas.nom).join(", ");
    article.appendChild(linia);
  }
  if (partida === id) {
    const cami = document.createElement("p");
    cami.textContent = t("es_partida");
    article.appendChild(cami);
  } else if (partida && partida !== id) {
    const origen = perId.get(partida);
    const cadena = camiDe(partida, id);
    const cami = document.createElement("p");
    if (!cadena) cami.textContent = tf("sense_cami", { nom: textNom(origen || { nom: t("la_partida"), cog: "" }) });
    else cami.textContent = tf("des_de", { nom: textNom(origen) }) + ": " + cadena.map((pas) => textRel(pas.r, true) + " " + pas.nom).join(" → ");
    article.appendChild(cami);
  }
  const branques = branquesDe(id);
  if (branques.length) {
    const veure = document.createElement("p");
    veure.textContent = t("veure") + " " + branques.join(", ");
    article.appendChild(veure);
  }
  const peuFitxa = document.createElement("p");
  peuFitxa.textContent = (persona.casa || branca) + " · " + DADES.versio;
  article.appendChild(peuFitxa);
  impressio.appendChild(article);
  estilPagines([]);
  const nomCurt = (persona.dim ? persona.dim + " " : "") + ((persona.nom || "") + " " + (persona.cog || "")).trim();
  llança(tf("fitxa_fitxer", { nom: nomCurt, versio: DADES.versio }));
}

function bytesDeBase64(text) {
  const bin = atob(text);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;

  return new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]);
}
function junta(parts) {
  let n = 0;
  for (const p of parts) n += p.length;
  const out = new Uint8Array(n);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function blocRar(tipus, flags, resta, dades) {
  const cos = junta([vint(tipus), vint(flags), resta]);
  const cap = junta([vint(cos.length), cos]);
  const parts = [u32le(crc32(cap)), cap];
  if (dades) parts.push(dades);
  return junta(parts);
}
function rarDe(fitxers) {
  const parts = [new Uint8Array([0x52, 0x61, 0x72, 0x21, 0x1A, 0x07, 0x01, 0x00])];
  parts.push(blocRar(1, 0, vint(0)));
  const encoder = new TextEncoder();
  for (const fitxer of fitxers) {
    const nom = encoder.encode(fitxer.nom);
    const resta = junta([
      vint(fitxer.dades.length), vint(4), vint(fitxer.dades.length), vint(0x20),
      u32le(crc32(fitxer.dades)), vint(0), vint(0), vint(nom.length), nom,
    ]);
    parts.push(blocRar(2, 2, resta, fitxer.dades));
  }
  parts.push(blocRar(5, 0, vint(0)));
  return junta(parts);
}
function mostraPerMesurar() {
  impressio.style.display = "block";
  impressio.style.position = "fixed";
  impressio.style.left = "0";
  impressio.style.top = "0";
  impressio.style.opacity = "0";
  impressio.style.pointerEvents = "none";
}
function amagaMesura() {
  impressio.style.display = "";
  impressio.style.position = "";
  impressio.style.left = "";
  impressio.style.top = "";
  impressio.style.opacity = "";
  impressio.style.pointerEvents = "";
}
async function pdfFamilia(nom, mode) {
  buidaImpressio();
  const sencers = afegeixBranca(nom, 0, mode === "sencer", mode === "a3");
  estilPagines(sencers);
  mostraPerMesurar();
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  const pagines = [];
  for (const seccio of impressio.querySelectorAll(".full")) pagines.push(paginaVector(seccio));
  const pdf = pdfDe(pagines);
  amagaMesura();
  buidaImpressio();
  return pdf;
}
function desaRar(bytes, nom) {
  const enllac = document.createElement("a");
  const url = URL.createObjectURL(new Blob([bytes], { type: "application/vnd.rar" }));
  enllac.href = url;
  enllac.download = nom;
  enllac.click();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function pintaFamiliesRar() {
  const caixa = document.getElementById("rar-families");
  if (caixa.childElementCount) return;
  for (const nom of DADES.ordre) {
    const etiqueta = document.createElement("label");
    etiqueta.style.borderLeft = "4px solid " + (DADES.colors[nom] || "#999");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.value = nom;
    input.checked = true;
    etiqueta.appendChild(input);
    etiqueta.appendChild(document.createTextNode(nom));
    caixa.appendChild(etiqueta);
  }
}
async function fesRar() {
  const triades = [...document.querySelectorAll("#rar-families input:checked")].map((el) => el.value);
  const estat = document.getElementById("rar-estat");
  const boto = document.getElementById("fes-rar");
  if (!triades.length) { estat.textContent = t("rar_cap"); return; }
  boto.disabled = true;
  try {
    const fitxers = [];
    let fet = 0;
    const total = triades.length * 2;
    for (const nom of triades) {
      for (const mode of ["sencer", "a3"]) {
        fet += 1;
        estat.textContent = tf("rar_preparant", { nom: nom, fet: fet, total: total });
        fitxers.push({
          nom: nom + "/" + nom + " - " + (mode === "a3" ? "A3" : "sencer") + ".pdf",
          dades: await pdfFamilia(nom, mode),
        });
      }
    }
    desaRar(rarDe(fitxers), "Families-" + DADES.versio + "-" + idioma + ".rar");
    estat.textContent = t("rar_fet");
  } catch (e) {
    estat.textContent = e && e.message ? e.message : String(e);
  } finally {
    boto.disabled = false;
    boto.textContent = t("descarrega");
    amagaMesura();
    buidaImpressio();
  }
}
pintaFamiliesRar();
document.getElementById("obre-rar").addEventListener("click", (e) => {
  e.stopPropagation();
  const panell = document.getElementById("rar");
  panell.hidden = !panell.hidden;
  document.getElementById("obre-rar").setAttribute("aria-expanded", panell.hidden ? "false" : "true");
  const llista = document.getElementById("llista-idiomes");
  const idiomaBoto = document.getElementById("idioma-actual");
  if (llista && idiomaBoto) {
    llista.hidden = true;
    idiomaBoto.setAttribute("aria-expanded", "false");
  }
});
document.getElementById("fes-rar").addEventListener("click", (e) => {
  e.stopPropagation();
  fesRar();
});
document.addEventListener("click", (e) => {
  const bloc = document.getElementById("rar-bloc");
  if (!bloc || bloc.contains(e.target)) return;
  document.getElementById("rar").hidden = true;
  document.getElementById("obre-rar").setAttribute("aria-expanded", "false");
});
</script>
